# The SHA-256 certificate fingerprint every Vesper Android release
# must carry.
#
# Android identifies an installed app by (applicationId, signing key).
# Ship a release signed with a different key and every existing
# install fails to update with INSTALL_FAILED_UPDATE_INCOMPATIBLE —
# the user must uninstall, losing every local vault, before they can
# take the update. This file makes a swapped or regenerated keystore
# a build failure instead of a shipped one.
#
# This pins the key WE sign with (the upload key). Under Google Play
# App Signing the key users verify is Google's re-signing key, not
# this one — do not "fix" this file by pinning that fingerprint.
#
# NOT YET RECORDED: sha256 is empty until the first real release key
# exists. The first signed release prints the exact command to record
# it (never auto-recorded — a machine holding the wrong keystore would
# pin the wrong key and disarm the whole mechanism):
#   python3 tools/android/android_signing/signing_cli.py pin \
#     --pin-file apps/vesper/deploy/android-release-key.properties --from <apk>
#
# Deliberate rotation:
#   python3 tools/android/android_signing/signing_cli.py pin \
#     --pin-file apps/vesper/deploy/android-release-key.properties --from <apk> --rotate
sha256=
alias=
subject=
