# Relay configuration. Every key is optional; these are the defaults.
data_dir: /var/lib/relay
# The at-rest key (mode 0600). Keep its backup apart from the data's.
master_key: /etc/relay/master.key
# What its page and its code call it. The page (http://<its onion>/, in Tor
# Browser) shows the code Enigma connects with; `relay code` prints it too.
name: Relay
page: true
limits:
  max_message_bytes: 262144      # a sealed image (Enigma sends pictures up to 192 KiB)
  max_messages_per_mailbox: 500
  max_mailbox_bytes: 8388608     # per mailbox, across its messages
  max_mailboxes: 10000
  message_ttl_days: 14
  max_record_bytes: 2048
  record_ttl_days: 15
  max_pairing_bytes: 49152
  pairing_ttl_days: 7
  requests_per_minute: 60
  max_concurrent: 32
