[package]
name = "enigma-slint"
version = "0.1.0"
description = "Enigma, the main app in Slint (desktop and Android), on enigma-app / enigma-core."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "enigma_slint"
path = "src/lib.rs"
# rlib for the desktop binary, tests and examples; cdylib for the Android .so (android_main).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "enigma"
path = "src/main.rs"

[dependencies]
enigma-app = { path = "../../crates/enigma-app" }
enigma-core = { path = "../../crates/enigma-core" }
slint = { version = "1.19", features = ["software-renderer-systemfonts"] }
# Voice notes: WAV everywhere; recording / playback with cpal on desktop.
hound = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"
# Desktop notifications for new messages while the window is away.
notify-rust = "4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
png = "0.17"
# Tests and screenshots: an in-memory Beacon directory instead of Tor.
beacon-node = { path = "../../crates/beacon-node" }

[package.metadata.android]
package = "com.spectrumaipl.enigma27.slint"
apk_name = "enigma27-slint"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[example]]
name = "slint-screens"
path = "examples/screens.rs"
