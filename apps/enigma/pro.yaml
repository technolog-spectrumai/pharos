# Enigma26 Professional — what `./build.sh` builds by default.
#
#   ./build.sh                 this file
#   ./build.sh std.yaml        the Standard preset instead
#   ./build.sh --dry-run       print the commands this file resolves to, run none
#   ./run_dev.sh               a dev run with this file's features
#
# "Professional" is a label for this list, nothing more: a preset is exactly
# the features it names. There are no build flags — this file is the whole
# interface. An unknown key or value is an error, never a default.

# Where finished packages are copied (under <output_dir>/enigma/), with a
# SHA256SUMS. Separate from Standard's: both presets produce a package with
# the same name.
output_dir: dist/pro

apps:
  enigma:
    # The optional features compiled into this build. Anything not listed is
    # not in the binary: not its Rust code, not its dependencies, not its
    # screens. The ids, and what each requires, are the `[features]` table of
    # apps/enigma/src-tauri/Cargo.toml; the list must name every requirement
    # itself (dht needs hosted_relays).
    #
    # Built in is not switched on: `dht` here makes the DHT available, and each
    # profile still opts in to using it.
    features:
      - hosted_relays   # iroh's n0 relays and pkarr/DNS discovery
      - dht             # room codes, the nickname directory, presence
      - calls           # 1:1 voice calls (the Vox tab)
      - contacts        # Contacts and direct room invites
      - calendar        # meetings and polls
      - keyring         # one passphrase locking many local files
      - pin_unlock      # re-unlock with a PIN after an idle lock

    # Run the app's frontend and Rust test suites first; a failure stops the
    # build before anything is packaged.
    test: false

    desktop:
      enabled: true
      profile: release          # release | debug (debug builds far faster, runs slower)
      # Package formats. Tauri compiles for the machine it runs on, so only
      # this host's formats are accepted: deb, rpm, appimage on Linux; dmg, app
      # on macOS; msi, nsis on Windows. Remove the line to use the targets in
      # the app's tauri.conf.json.
      bundles: [deb, rpm]

    android:
      enabled: false
      profile: debug            # debug | release (release needs a signing key — technology.md §19)
      abis: [aarch64]           # aarch64 (phones) | x86_64 (emulator) | armv7 | i686, or [all]
      # A release that is deliberately NOT signed. It installs nowhere and
      # must never be distributed.
      allow_unsigned_release: false
