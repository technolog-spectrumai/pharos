[package]
name = "totoclient"
version = "0.1.0"
description = "Talking to a toto platform server — pinned TLS, an OS-keyring token, and an allowlisted proxy"
authors = ["SpectrumAI"]
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# COPIED VERBATIM from the commit that removed them (`f072ea82 drop the cloud
# commands and tls crates`), not re-resolved, because two of these feature sets
# are not what `cargo add` picks and the code does not compile without them:
#
#   * `rustls-tls-manual-roots` on reqwest — the pinned verifier installs its
#     own root store. The default `rustls-tls` bundles roots and gives no seam
#     to replace them.
#   * `ring` on rustls — `WebPkiServerVerifier::builder_with_provider` is handed
#     `rustls::crypto::ring::default_provider()` by name.
#
# `limbo/cloud/LIMBO.md` says exactly this under "To lift it back". It was
# right.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
sha2 = "0.10"
# `vendored` builds libsecret rather than linking the system one, so a machine
# without the -dev package still builds. `sync-secret-service` because the
# callers are async but the store is used from a blocking path.
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }

# No `tauri` dependency, on purpose — the same rule `substrate` states. This
# crate exports plain functions and each app expands its own
# `#[tauri::command]` shims over them, so the command names stay the app's own
# and the frontend's invoke strings never change.

[dev-dependencies]
# For the async guard tests only. `request` is `async fn`, and its refusals —
# the allowlist, the method set, the body ceiling — all happen before a socket
# is opened, so they are worth testing and need a runtime to await on. Minimal
# features: no I/O driver, nothing here ever reaches the network.
tokio = { version = "1", features = ["macros", "rt"] }
