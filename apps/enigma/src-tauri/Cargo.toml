[package]
name = "enigma"
version = "0.1.10"
description = "Enigma27 — serverless, end-to-end-encrypted (MLS) peer-to-peer chat (Tauri shell)"
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enigma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# One edition: no optional features. Chat (iroh and Tor), file transfer,
# invitations and PIN unlock are always built in.
[build-dependencies]
tauri-build = { version = "2", features = [] }
# build_config.yaml → generated consts (see build.rs). Build-time only: the
# shipped binary contains no YAML parser. serde_norway is the maintained fork
# of the archived serde_yaml (same serde API, pure Rust — Android-safe).
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
# Reads tauri.conf.json for the app-identity equality assert.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native file/save dialogs for picking a file to send and where to save a received one.
tauri-plugin-dialog = "2"
# Native OS notifications (desktop + Android/iOS) for upcoming-meeting reminders.
tauri-plugin-notification = "2"
# Belisario step 12: enigma:// links (Teutates opens the co-op's room in Enigma).
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crypto layer (OpenMLS via Rotor). The crypto crates are the repo's shared ones
# (crates/rotor), consumed by path — so building enigma fetches nothing but
# crates.io.
rotor-core = { path = "../../../crates/rotor/rotor_core" }
# MLS sessions per (room, identity), kept in the vault.
enigmatite = { path = "../../../crates/enigmatite" }
# Encryption at rest: the centralized encrypted store (protasius) built on the
# crypto primitives crate (gervasius). All app data persists through protasius.
protasius = { path = "../../../crates/protasius" }
# Reused directly (not just via protasius) for the PIN-unlock and panic-code
# envelopes in vault.rs.
gervasius = { path = "../../../crates/gervasius" }
zeroize = "1"
cpal = "0.15"
hound = "3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
# Embedded pure-Rust Tor (arti): the only transport (mesh.rs). `onion-service-service`
# hosts onions and keeps their keys (keymgr, tor-persist); `vanguards` gives
# onion circuits vanguard sets (full mode is set in mesh.rs).
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "compression", "vanguards"] }
# The vanguard mode, set explicitly (arti 0.43 does not choose full mode for
# onion services by itself).
tor-guardmgr = { version = "0.43", features = ["vanguards"] }
tor-config = "0.43"
tor-rtcompat = { version = "0.43", features = ["tokio", "rustls"] }
# Hosting types not re-exported by arti-client: the onion-service config/launch
# surface, and the `Connected` relay cell used to accept an inbound onion stream.
tor-hsservice = "0.43"
tor-cell = "0.43"
# HsId (the .onion address) is redaction-safe and has no plain Display; the
# DisplayRedacted trait gives the full address for the QR ticket.
safelog = "0.8"
# MSRV pin (from when Cargo.lock was not committed): typed-index-collections
# 3.4+ requires rustc 1.90, but arti pulls it in transitively. Hold it at 3.3.0
# (supports rustc 1.85+) until the toolchain moves to >= 1.90, then this can drop.
typed-index-collections = "=3.3.0"
data-encoding = "2"
# arti's TLS: rustls cannot pick a crypto provider on its own when more than
# one is linked, so mesh.rs installs ring for the process.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The device key (device.rs): invitations are sealed to it and redeemed by it.
ed25519-dalek = "3.0"
# Seals invitation tickets and redemption messages.
# 0.10 pinned: 0.11 changes the aead API surface.
chacha20poly1305 = "0.10"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
futures-lite = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_22"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
# arti-client pulls in rusqlite (tor-dirmgr's directory cache) which links the
# system libsqlite3. The Android NDK ships no libsqlite3, so the cross-link fails
# with `ld.lld: unable to find library -lsqlite3`. Declaring rusqlite here (same
# version arti resolves) with `bundled` makes libsqlite3-sys compile SQLite from
# source via the NDK clang. Android-only, so desktop keeps using the system lib.
rusqlite = { version = "0.39", features = ["bundled"] }

# [profile.dev] — split-debuginfo = "unpacked" — lives in the repo-root
# Cargo.toml: a workspace member's [profile.*] is ignored. The enigma debug
# binary embeds hundreds of MB of DWARF (arti + cpal + tauri), and the
# GNU linker merging it all is OOM-killed on low-RAM machines without it.
