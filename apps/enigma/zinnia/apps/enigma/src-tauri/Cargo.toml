[package]
name = "enigma"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enigma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native file/save dialogs for picking a file to send and where to save a received one.
tauri-plugin-dialog = "2"
# Native OS notifications (desktop + Android/iOS) for upcoming-meeting reminders.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rotor-core = { path = "../../../../toto/rotors/rotor_core" }
zeroize = "1"
# AEAD for Vox call audio, keyed by an MLS-exported secret (pure Rust, Android-safe).
chacha20poly1305 = "0.10"
cpal = "0.15"
hound = "3"
# Pure-Rust FFT for the real-time Vox call equalizer (incoming-audio spectrum).
rustfft = "6"
# Rust-owned data layer: HTTP gateway (reqwest), realtime WS backend
# (tokio-tungstenite), async runtime + helpers.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Embedded pure-Rust Tor (arti) so the client can reach a .onion server without an
# external tor daemon. Plain HTTP over the onion stream uses hyper directly (reqwest
# can't take a custom transport); WS reuses tokio-tungstenite's client_async.
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
tor-rtcompat = { version = "0.43", features = ["tokio", "rustls"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# TLS over the Tor stream (https/wss onion). tokio-rustls 0.26 + rustls 0.23 are
# already in the tree via reqwest/tungstenite; ring provider avoids a C toolchain.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# MSRV pin (Cargo.lock is gitignored, so this must live here): typed-index-collections
# 3.4+ requires rustc 1.90, but arti pulls it in transitively. Hold it at 3.3.0
# (supports rustc 1.85+) until the toolchain moves to >= 1.90, then this can drop.
typed-index-collections = "=3.3.0"
data-encoding = "2"
# Direct P2P chat backend (iroh-gossip over QUIC).
iroh = "0.98"
iroh-gossip = "0.98"
# Stream helpers for the aster address-lookup (matches iroh's BoxStream type).
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
bytes = "1"
futures-lite = "2"
anyhow = "1"
# Local key/value cache backend (pure-Rust LSM, no C deps — same rationale as
# μ-law/rustls/flat-file cache). Used by kv.rs and the data gateway cache.
fjall = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_22"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

[profile.dev]
# The enigma debug binary embeds hundreds of MB of DWARF (iroh + arti + cpal +
# tauri). The GNU linker merging it all spikes to multiple GB and gets OOM-killed
# (`ld ... signal 9`) on low-RAM machines. Keeping debug info in the object files
# instead of linking it into the executable slashes peak linker memory and binary
# size; full gdb debugging still works (it reads the .o files).
split-debuginfo = "unpacked"

