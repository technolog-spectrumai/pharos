[package]
name = "zinnia"
version = "0.1.0"
description = "Zinnia — an office suite for the toto platform"
authors = ["SpectrumAI"]
license = ""
repository = "https://gitlab.com/janhagit-group/zinnia"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "zinnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# The whole Rust surface for now: native file dialogs, reading and writing the
# files the editors open, and opening external links. Zinnia deliberately has no
# custom commands — anything a plugin already does should not become Rust here.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.dev]
# Tauri + webkit2gtk produce enough DWARF that the GNU linker can OOM-kill the
# build on a modest machine; unpacked debuginfo keeps it out of the link step.
split-debuginfo = "unpacked"
