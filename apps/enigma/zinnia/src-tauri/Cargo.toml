[package]
name = "zinnia"
version = "0.1.0"
description = "Zinnia — an office suite for the toto platform"
authors = ["SpectrumAI"]
license = ""
repository = "https://gitlab.com/janhagit-group/zinnia"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "zinnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# The whole Rust surface for now: native file dialogs, reading and writing the
# files the editors open, and opening external links. Zinnia deliberately has no
# custom commands — anything a plugin already does should not become Rust here.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# ── file locking, self-contained ────────────────────────────────────────────
# Argon2id wraps a random per-file DEK, which seals the bytes with
# XChaCha20-Poly1305; the salt and costs ride along in the file's own header, so
# a sealed file needs nothing but its password. See src/lock.rs for why that
# replaced deriving the key from a salt the server owned.
#
# `fernet` comes in through gervasius and drags `openssl-sys` with it, which is
# the only reason native OpenSSL is linked into this binary. It is READ-ONLY
# legacy: nothing writes that format, and src/lock.rs refuses those files
# outright now that their salt source is parked.
gervasius = { path = "../packages/rakotis/crates/gervasius" }
base64 = "0.22"

# ── remembering one passphrase ──────────────────────────────────────────────
# The OS secret store, so sealing a second file need not mean typing it again.
# `vendored` builds libsecret's dependency rather than trusting whatever the
# build host has; `sync-secret-service` keeps the API blocking, which is what
# the commands in src/secrets.rs are. No command ever returns what is stored —
# the sealing commands ask for it inside Rust.
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }

[profile.dev]
# Tauri + webkit2gtk produce enough DWARF that the GNU linker can OOM-kill the
# build on a modest machine; unpacked debuginfo keeps it out of the link step.
split-debuginfo = "unpacked"
