[package]
name = "zinnia"
version = "0.1.0"
description = "Zinnia — an office suite for the toto platform"
authors = ["SpectrumAI"]
license = ""
repository = "https://gitlab.com/janhagit-group/zinnia"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "zinnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# The whole Rust surface for now: native file dialogs, reading and writing the
# files the editors open, and opening external links. Zinnia deliberately has no
# custom commands — anything a plugin already does should not become Rust here.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# ── the cloud session ───────────────────────────────────────────────────────
# The one place custom Rust was unavoidable. @tauri-apps/plugin-http was ruled
# out for two reasons: it puts the session token back within reach of page
# JavaScript (this app renders untrusted .svg and deck HTML, and the webview has
# no CSP), and it cannot express "verify normally, but also accept this one
# pinned certificate" — which is the only way to reach a self-signed server
# without switching verification off wholesale.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
sha2 = "0.10"
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }

# ── file locking, zenobia-compatible ────────────────────────────────────────
# The SAME construction the platform's file vault uses — Argon2id over the
# user's server-side salt, then Fernet — so a file locked here decrypts there
# and vice versa. gervasius (enigma's AEAD) was considered and set aside for
# this: it cannot be both, and interop with files that already exist won.
# The construction lives in rakotis now, beside the native envelope — see
# packages/rakotis/crates/gervasius/src/gervazy.rs. Shared rather than copied:
# two implementations of a byte-compatible format is two chances to drift.
gervasius = { path = "../packages/rakotis/crates/gervasius" }
base64 = "0.22"

[profile.dev]
# Tauri + webkit2gtk produce enough DWARF that the GNU linker can OOM-kill the
# build on a modest machine; unpacked debuginfo keeps it out of the link step.
split-debuginfo = "unpacked"
