[package]
name = "collab"
version = "0.1.0"
description = "A two-peer session over iroh-gossip: pair by ticket, exchange bytes"
authors = ["SpectrumAI"]
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# The ticket is postcard + base32, not JSON: it is read by a camera, and every
# byte costs QR modules the other device has to resolve.
postcard = { version = "1.1", features = ["use-std"] }
data-encoding = "2.11"
blake3 = "1.8"

# ── the transport, optional ─────────────────────────────────────────────────
# OFF BY DEFAULT, and that is the point. iroh is ~360 crates and 40s of clean
# build; an app that does not offer collaboration must not pay for it, exactly
# as an app that does not offer sealing does not link the keyring (crates/padova).
# `cargo tree -p sketch | grep iroh` is empty without `--features collab`.
#
# Default features stay ON for both: iroh's `presets::N0`/`Minimal` are behind
# `cfg(with_crypto_provider)`, which its build.rs derives from the `tls-ring`
# DEFAULT feature — turning defaults off silently removes the presets this
# crate is built on. iroh-gossip's `net` default provides Gossip::builder.
iroh = { version = "0.98", optional = true }
iroh-gossip = { version = "0.98", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
futures-lite = { version = "2", optional = true }

[features]
default = []
# The live transport. Without it this crate is the ticket format and the frame
# codec — pure data, no network, and still worth compiling and testing.
net = ["dep:iroh", "dep:iroh-gossip", "dep:tokio", "dep:futures-lite"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
