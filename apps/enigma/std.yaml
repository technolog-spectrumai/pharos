# Enigma26 Standard.
#
#   ./build.sh std.yaml              build it
#   ./build.sh std.yaml --dry-run    print the commands, run none
#   ./run_dev.sh std.yaml            a dev run with this file's features
#
# "Standard" is a label for this list, nothing more: a preset is exactly the
# features it names. Same schema as pro.yaml — see that file for what each key
# means.

output_dir: dist/std

apps:
  enigma:
    # Not in this build, and therefore not in its binary: dht, calls, calendar.
    # A Standard user can still sit in a room with a Professional one — what
    # they cannot do is receive a call or a meeting from it.
    features:
      - hosted_relays   # iroh's n0 relays and pkarr/DNS discovery
      - contacts        # Contacts and direct room invites
      - keyring         # one passphrase locking many local files
      - pin_unlock      # re-unlock with a PIN after an idle lock

    test: false

    desktop:
      enabled: true
      profile: release
      bundles: [deb, rpm]

    android:
      enabled: false
      profile: debug
      abis: [aarch64]
      allow_unsigned_release: false
