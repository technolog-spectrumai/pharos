[package]
name = "aurora"
version = "0.1.0"
description = "Aurora — data workspace with MLS relay chat"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native file/save dialogs for picking a file to send and where to save a received one.
tauri-plugin-dialog = "2"
# Native OS notifications (desktop + Android/iOS) for upcoming-meeting reminders.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rotor-core = { git = "https://gitlab.com/janhagit-group/cryptorotor.git", tag = "v0.1.0" }
zeroize = "1"
# Audio capture/encoding for async voice messages (pure Rust, Android-safe).
cpal = "0.15"
hound = "3"
# Rust-owned data layer: HTTP gateway (reqwest), realtime WS backend
# (tokio-tungstenite), async runtime + helpers.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Embedded pure-Rust Tor (arti) so the client can reach a .onion server without an
# external tor daemon. Plain HTTP over the onion stream uses hyper directly (reqwest
# can't take a custom transport); WS reuses tokio-tungstenite's client_async.
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
tor-rtcompat = { version = "0.43", features = ["tokio", "rustls"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# TLS over the Tor stream (https/wss onion). tokio-rustls 0.26 + rustls 0.23 are
# already in the tree via reqwest/tungstenite; ring provider avoids a C toolchain.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# MSRV pin (Cargo.lock is gitignored, so this must live here): typed-index-collections
# 3.4+ requires rustc 1.90, but arti pulls it in transitively. Hold it at 3.3.0
# (supports rustc 1.85+) until the toolchain moves to >= 1.90, then this can drop.
typed-index-collections = "=3.3.0"
data-encoding = "2"
# blake3: content hashing for the y_store CRDT projection. bytes: shared buffer type
# used across the data/realtime/tor layers.
blake3 = "1"
bytes = "1"
anyhow = "1"
# Mission data layer: a yrs CRDT document persisted with fjall (pure-Rust LSM, no C
# deps — same rationale as μ-law/rustls/flat-file cache). yrs is pinned to 0.19 to match
# yrs-kvstore 0.3 (its KVStore→DocOps trait is implemented over a fjall partition).
yrs = "0.19"
yrs-kvstore = "0.3"
fjall = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_22"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
# arti-client pulls in rusqlite (tor-dirmgr's directory cache) which links the
# system libsqlite3. The Android NDK ships no libsqlite3, so the cross-link fails
# with `ld.lld: unable to find library -lsqlite3`. Declaring rusqlite here (same
# version arti resolves) with `bundled` makes libsqlite3-sys compile SQLite from
# source via the NDK clang. Android-only, so desktop keeps using the system lib.
rusqlite = { version = "0.39", features = ["bundled"] }

