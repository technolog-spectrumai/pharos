[package]
name = "sketch"
version = "0.1.0"
description = "Sketch — the drawing board"
authors = ["SpectrumAI"]
license = ""
repository = "https://gitlab.com/janhagit-group/zinnia"
edition = "2021"
rust-version = "1.88"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "sketch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Standard operations go through stock plugins: native file dialogs, reading and
# writing the files the editors open, and opening external links. Anything a
# plugin already does should not become Rust here. Custom commands exist only
# for application-specific work a webview cannot do — sealing a file
# (src/lock.rs) and holding its passphrase in the OS keyring (src/secrets.rs).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# ── file locking ────────────────────────────────────────────────────────────
# Two crates, and the line between them is deliberate. Substrate knows what a
# sealed file LOOKS like — every app needs that, to badge one and to refuse
# handing ciphertext to an editor. Padova can OPEN one, which needs a password
# and therefore the OS keyring. This app offers sealing, so it depends on both;
# an app that does not depends on substrate alone and never links libsecret.
# Neither `gervasius` nor `keyring` is named here any more: they are padova's.
substrate = { path = "../../../crates/substrate", features = ["legacy-detect"] }
# `legacy-detect`: these apps opened the platform's older Fernet files once,
# so they badge and name that format rather than saying "wrong password". It
# costs openssl-sys, which is why it is opt-in — enigma does not take it.
padova = { path = "../../../crates/padova", features = ["legacy-detect"] }

# ── collaboration, OPT-IN ───────────────────────────────────────────────────
# Two peers drawing on one board over iroh. Optional and off by default: iroh is
# ~360 crates and 40 s of clean build, and an app that is not collaborating must
# not pay for it — the same rule that keeps the keyring out of apps that do not
# seal. `cargo tree -p sketch | grep iroh` is empty without `--features collab`.
#
# The gated code is NOT type-checked by a default build (a cfg'd type error
# compiles clean — proven). `npm run test:rust:net` is what checks it.
collab = { path = "../../../crates/collab", optional = true }

# ── persistence, OPT-IN ─────────────────────────────────────────────────────
# The board on disk, so a crash or a restart does not lose it. Optional and off
# by default like everything else here, and for the same reason: an app that
# does not want it should not link an embedded database.
#
# fjall is the store enigma already keeps all its state in (through protasius);
# hoard takes it directly because protasius fsyncs every single write with no
# batch API — 3.4 ms against 19.5 µs batched, measured — and refuses to read or
# write at all until a passphrase unlocks it, which sketch has never asked for.
hoard = { path = "../../../crates/hoard", optional = true }

[features]
default = []
# The transport alone: two peers over QUIC, already end to end.
collab = ["dep:collab", "collab/net"]
# The transport plus the group key. What this adds over `collab` is
# post-compromise security now, and the ability to have a THIRD peer later —
# on a gossip topic a forwarding peer decrypts and re-broadcasts, so transport
# encryption cannot carry N peers but one group key can. See crates/collab/src/mls.rs.
collab-mls = ["collab", "collab/mls"]
# The board survives a crash. Independent of `collab`: a drawing is worth
# keeping whether or not anyone else is looking at it.
persist = ["dep:hoard"]

# `[profile.dev]` used to be here. It lives in the ROOT Cargo.toml now: a
# profile in a workspace member is ignored with only a warning, and the one
# it carried (split-debuginfo, against linker OOM) must not be silently lost.
