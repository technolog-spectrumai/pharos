# ─────────────────────────────────────────────────────────────────────────────
# ENIGMA BASIC — "the private organiser".
#
# Selected with `ENIGMA_EDITION=basic` (build.rs reads this file instead of
# ../build_config.yaml). Product rationale + the full feature matrix live in
# pland.md; the per-key semantics are documented in ../build_config.yaml, which
# stays the annotated reference copy.
#
# IN:  contacts, calendar, PIN unlock, device linking — plus everything that
#      has no gate (chat, files, local locked files, vault / panic code).
# OUT: hosted relays and the DHT (rooms pair by ticket/QR and reconnect on
#      LAN or via Tor), peer sync, keyring, voice calls, maps.
#
# INVARIANT: only the feature gates differ between editions. crypto:, network:
# and settings: are byte-identical across basic/standard/professional —
# network.max_frame_bytes in particular is wire-interop sensitive (a Basic peer
# must be able to share a room with a Professional peer). See pland.md §3.
# ─────────────────────────────────────────────────────────────────────────────

app:
  # App identity is fixed across editions. Editions change feature gates only;
  # Android installs the fixed Gradle applicationId com.spectrumaipl.enigma26.
  name: Enigma26
  identifier: com.spectrumaipl.enigma26
  version: 0.1.6


p2p:
  allow_hosted_relays: false

dht:
  # The only edition with the Mainline DHT: join-by-room-code, the nickname
  # directory and presence. Still OPT-IN per profile (features.dht_discovery
  # below stays false) — the build gate only decides whether it can be offered.
  enabled: false

crypto:
  mls_ciphersuite: MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
  at_rest_aead: xchacha20-poly1305
  kdf:
    algorithm: argon2id
    m_cost_kib: 65536   # 64 MiB
    t_cost: 3
    p_cost: 4

calls:
  enabled: false

contacts:
  enabled: true

calendar:
  enabled: true


maps:
  enabled: false

lock:
  pin_unlock: true

keyring:
  enabled: false


features:
  use_tor: false
  stable_onion: false
  dht_discovery: false
  dht_nick_publish: false
  file_integrity: true

settings:
  connect_timeout_secs:  { default: 60,  min: 5,  max: 600 }
  dht_room_publish_secs: { default: 600, min: 60, max: 3600 }
  max_file_size_mb:      { default: 16,  min: 0,  max: 102400 }  # 0 = unlimited
  map_storage_limit_mb:  { default: 512, min: 64, max: 65536 }   # total on-disk map regions
  chat_history_cap_msgs:    { default: 500, min: 50, max: 5000 }
  idle_lock_mins:           { default: 15,  min: 0,  max: 120 }
  file_chunk_kib:           { default: 256, min: 16, max: 4096 }
  pin_digits:               { default: 6, min: 4, max: 12 }

network:
  max_frame_bytes: 16777216      # 16 MiB — DO NOT diverge per edition
  onion_port: 9999
  tor_write_timeout_secs: 20
  tor_handshake_timeout_secs: 30
