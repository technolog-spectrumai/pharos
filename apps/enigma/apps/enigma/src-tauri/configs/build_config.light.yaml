# ─────────────────────────────────────────────────────────────────────────────
# ENIGMA LIGHT — "just the encrypted chat".
#
# Selected with `ENIGMA_EDITION=light` (build.rs reads this file instead of
# ../build_config.yaml). Product rationale + the full feature matrix live in
# pland.md; the per-key semantics are documented in ../build_config.yaml, which
# stays the annotated reference copy.
#
# IN : P2P MLS chat, QR/ticket pairing, Tor, file transfer, local locked files
#      + notes, vault / panic code / idle lock / airplane mode.
# OUT: the DHT (so no join-by-room-code, nickname directory or presence),
#      contacts, voice calls, device linking, calendar, maps.
#
# INVARIANT: only the feature gates differ between editions. crypto:, network:
# and settings: are byte-identical across light/plus/pro — network.max_frame_bytes
# in particular is wire-interop sensitive (a Light peer must be able to share a
# room with a Pro peer). See pland.md §3.
# ─────────────────────────────────────────────────────────────────────────────

app:
  # Each edition is its OWN installable app. `tauri.<edition>.conf.json` overlays
  # productName / mainBinaryName / identifier onto tauri.conf.json (pass it with
  # --config; build.rs applies the same overlay before asserting equality here).
  # The distinct identifier is what gives the edition its own data directory, so
  # a release install and a test install never share a vault. See build.md.
  name: Enigma Light
  identifier: com.spectrumaipl.enigma.light
  version: 0.1.0


p2p:
  # Stays true in every edition: n0 relay fallback + pkarr discovery are what
  # make NAT-to-NAT pairing and reconnect-to-a-saved-NodeId work at all.
  allow_hosted_relays: true

dht:
  enabled: false                  # Pro only — pairing here is QR/ticket only

crypto:
  mls_ciphersuite: MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
  at_rest_aead: xchacha20-poly1305
  kdf:
    algorithm: argon2id
    m_cost_kib: 65536   # 64 MiB
    t_cost: 3
    p_cost: 4

calls:
  enabled: false                  # Plus and up

contacts:
  enabled: false                  # Plus and up

calendar:
  enabled: false                  # Pro only

peers:
  # false = this build has no peer sync: no Peers surface, the `enigma/plink/0`
  # ALPN is not registered (a request from a Pro peer is refused at negotiation),
  # usePeerSync is never instantiated, and every peer_* command fails fast with
  # PEERS_DISABLED. Person-to-person scoped sync — see peer.md.
  enabled: false                  # Pro only

maps:
  enabled: false                  # Pro only

lock:
  # Pro only
  pin_unlock: false

keyring:
  enabled: false                  # Pro only

devices:
  allow_linking: false            # Plus and up — Light is single-device

features:
  # Runtime DEFAULTS for a new profile, not gates. The two dht_* seeds are
  # unreachable here anyway — `dht.enabled: false` above short-circuits ahead of
  # them — and are kept only because every edition declares the same key set.
  use_tor: false
  stable_onion: false
  dht_discovery: false
  dht_nick_publish: false
  file_integrity: true

settings:
  connect_timeout_secs:  { default: 60,  min: 5,  max: 600 }
  dht_room_publish_secs: { default: 600, min: 60, max: 3600 }
  max_file_size_mb:      { default: 16,  min: 0,  max: 102400 }  # 0 = unlimited
  map_storage_limit_mb:  { default: 512, min: 64, max: 65536 }   # inert (maps off)
  devlink_pair_window_secs: { default: 600, min: 60, max: 3600 } # inert (linking off)
  devlink_resync_secs:      { default: 300, min: 30, max: 3600 } # inert (linking off)
  chat_history_cap_msgs:    { default: 500, min: 50, max: 5000 }
  idle_lock_mins:           { default: 15,  min: 0,  max: 120 }
  # Peer sync (peer.md): how often a live link re-announces and pulls a diff.
  peer_resync_secs:         { default: 300, min: 30, max: 3600 }
  file_chunk_kib:           { default: 256, min: 16, max: 4096 }
  pin_digits:               { default: 6, min: 4, max: 12 }

network:
  max_frame_bytes: 16777216      # 16 MiB — DO NOT diverge per edition
  onion_port: 9999
  tor_write_timeout_secs: 20
  tor_handshake_timeout_secs: 30
