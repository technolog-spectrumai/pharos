# ─────────────────────────────────────────────────────────────────────────────
# ENIGMA PRO — "the collaboration suite".
#
# Selected with `ENIGMA_EDITION=pro` (build.rs reads this file instead of
# ../build_config.yaml). Product rationale + the full feature matrix live in
# pland.md; the per-key semantics are documented in ../build_config.yaml, which
# stays the annotated reference copy.
#
# = Plus, PLUS: calendar (meetings + polls), maps, and the Enigma Cloud client
#   for the user's OWN self-hosted server.
#
# Pro is the only edition shipping cloud.allow_connections: true — its users are
# the ones who deliberately stood up their own infrastructure. The client still
# talks to nothing until a server is configured in Settings.
#
# INVARIANT: only the feature gates differ between editions. crypto:, network:
# and settings: are byte-identical across light/plus/pro — network.max_frame_bytes
# in particular is wire-interop sensitive (a Light peer must be able to share a
# room with a Pro peer). See pland.md §3.
# ─────────────────────────────────────────────────────────────────────────────

app:
  # Must MATCH tauri.conf.json — build.rs asserts equality. Distinct per-edition
  # product names / bundle ids need per-edition tauri.conf.json variants first
  # (pland.md §6.1), so all three editions currently declare the same identity.
  name: Enigma
  identifier: com.spectrumaipl.enigma
  version: 0.1.0

cloud:
  allow_connections: true

p2p:
  allow_hosted_relays: true

dht:
  # The only edition with the Mainline DHT: join-by-room-code, the nickname
  # directory and presence. Still OPT-IN per profile (features.dht_discovery
  # below stays false) — the build gate only decides whether it can be offered.
  enabled: true

crypto:
  mls_ciphersuite: MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
  at_rest_aead: xchacha20-poly1305
  kdf:
    algorithm: argon2id
    m_cost_kib: 65536   # 64 MiB
    t_cost: 3
    p_cost: 4

calls:
  enabled: true

contacts:
  enabled: true

calendar:
  enabled: true

peers:
  # false = this build has no peer sync: no Peers surface, the `enigma/plink/0`
  # ALPN is not registered (a request from a Pro peer is refused at negotiation),
  # usePeerSync is never instantiated, and every peer_* command fails fast with
  # PEERS_DISABLED. Person-to-person scoped sync — see peer.md.
  enabled: true

maps:
  enabled: true

lock:
  pin_unlock: true

keyring:
  enabled: true

devices:
  allow_linking: true

features:
  use_tor: false
  stable_onion: false
  dht_discovery: false
  dht_nick_publish: false
  file_integrity: true

settings:
  connect_timeout_secs:  { default: 60,  min: 5,  max: 600 }
  dht_room_publish_secs: { default: 600, min: 60, max: 3600 }
  max_file_size_mb:      { default: 16,  min: 0,  max: 102400 }  # 0 = unlimited
  map_storage_limit_mb:  { default: 512, min: 64, max: 65536 }   # total on-disk map regions
  devlink_pair_window_secs: { default: 600, min: 60, max: 3600 }
  devlink_resync_secs:      { default: 300, min: 30, max: 3600 }
  chat_history_cap_msgs:    { default: 500, min: 50, max: 5000 }
  idle_lock_mins:           { default: 15,  min: 0,  max: 120 }
  # Peer sync (peer.md): how often a live link re-announces and pulls a diff.
  peer_resync_secs:         { default: 300, min: 30, max: 3600 }
  file_chunk_kib:           { default: 256, min: 16, max: 4096 }
  pin_digits:               { default: 6, min: 4, max: 12 }

network:
  max_frame_bytes: 16777216      # 16 MiB — DO NOT diverge per edition
  onion_port: 9999
  max_redirects: 5
  tor_write_timeout_secs: 20
  tor_handshake_timeout_secs: 30
