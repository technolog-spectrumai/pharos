# Enigma build configuration — baked in at COMPILE TIME by src-tauri/build.rs.
# build.rs validates this file, generates Rust consts from it (enigma_lib's
# `build_config` module), and FAILS THE BUILD on any invalid or missing value.
# The shipped binary never re-reads this file. Defaults below match current
# main exactly: a default build is behaviorally identical to one before this
# file existed.

app:
  # Must MATCH tauri.conf.json (productName / identifier / version), which stays
  # authoritative for the native bundle — build.rs asserts equality.
  name: Enigma26
  identifier: com.spectrumaipl.enigma
  version: 0.1.3


p2p:
  # false = iroh runs with RelayMode::Disabled (no n0-hosted relays) and all
  # hosted discovery is off: pkarr/DNS publishing AND the Mainline DHT (which
  # rides the same endpoint, so `dht.enabled` below cannot rescue it). Direct
  # QUIC (ticket/QR bootstrap) and the Tor onion transport keep working, but
  # reconnecting to a bare NodeId does not — nothing is left to resolve it.
  allow_hosted_relays: true

dht:
  # false = the Mainline DHT is compiled out of reach: no rendezvous publishing,
  # no ticketless join-by-room-code, no nickname directory, no presence. The
  # Settings→Connections DHT card is hidden, the Contacts nickname/find-people
  # surfaces go with it, and dht_presence / dht_publish_nick / dht_find_nick /
  # dht_apply fail fast with DHT_DISABLED. Pro only (pland.md).
  #
  # Requires p2p.allow_hosted_relays — build.rs rejects the combination, since
  # the rendezvous rides the iroh endpoint's hosted discovery.
  #
  # Note this is the BUILD gate. `features.dht_discovery` below is a different
  # thing: the per-profile runtime default, which stays opt-in even in Pro.
  enabled: true

crypto:
  # Declarations, ASSERTED at compile time against the vendored crates
  # (cryptorotor/rotor_core, cryptorotor/gervasius) — a mismatch fails the
  # build. Changing these strings does NOT change the algorithms; change the
  # crates and then update the declaration here.
  mls_ciphersuite: MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
  at_rest_aead: xchacha20-poly1305
  kdf:
    algorithm: argon2id
    # Argon2id costs for NEWLY created vaults (the per-profile protasius store
    # and per-file "lock a file"). Existing vaults are untouched: each vault
    # header records its own costs, so old data always unlocks. The derived-key
    # length is fixed at 32 bytes and not configurable.
    m_cost_kib: 65536   # 64 MiB
    t_cost: 3
    p_cost: 4

calls:
  # false = this build has no 1:1 voice calls: no Calls tab, /calls redirects,
  # stores/chat.ts never instantiates useVoxCall (so no call offer ever lands),
  # and every vox_* command fails fast with CALLS_DISABLED.
  enabled: true

contacts:
  # false = this build has no Contacts: no Contacts tab, /contacts redirects,
  # and useRoomInvites is never instantiated (direct room invites are neither
  # sent nor received). DHT room codes are unaffected — only the presence /
  # nickname-directory surface lives in Contacts.
  enabled: true

calendar:
  # false = this build has no Calendar: no Calendar tab, /calendar redirects,
  # useMeetings is never instantiated (no meetings, no polls, no reminder tick).
  enabled: true

peers:
  # false = this build has no peer sync: no Peers surface, the `enigma/plink/0`
  # ALPN is not registered (a request from a Pro peer is refused at negotiation),
  # usePeerSync is never instantiated, and every peer_* command fails fast with
  # PEERS_DISABLED. Person-to-person scoped sync — see peer.md.
  enabled: true

maps:
  # false = this build has no Maps: no Map tab, /map redirects, and every map_*
  # command fails fast with MAPS_DISABLED. Default true ships the feature.
  # The app NEVER fetches tiles itself — region packages are produced by the
  # standalone tools/map_packager and imported from the device (map.md Part II).
  enabled: true

# PIN unlock: after an idle lock, re-open the vault with a short PIN on an
# on-screen keypad instead of retyping the passphrase. CONVENIENCE ONLY — the
# PIN is memory-resident, so a restart still demands the passphrase and nothing
# PIN-derived ever reaches disk (technology.md §7).
lock:
  # false = no PIN surface at all: no keypad, no Settings card, and the
  # vault_pin_* commands fail with PIN_UNLOCK_DISABLED.
  pin_unlock: true

keyring:
  # false = this build has no key ring (one passphrase locking MANY local
  # files): every keyring_* command fails fast with KEYRING_DISABLED. The ring
  # file (<profile_dir>/keyring.enig) is device-local and never synced; the
  # per-file "lock a file" (local_lock.rs) is unaffected — it is always in.
  enabled: true

devices:
  # false = this build has no device linking: every devlink_* command fails
  # fast with DEVLINK_DISABLED and the Settings→Devices tab is hidden. Linking
  # is pure P2P (iroh QUIC between the user's own devices; no third parties),
  # so default true ships the feature.
  allow_linking: true

features:
  # Initial values for a NEW profile's toggles. Runtime Settings switches still
  # override per profile; profiles saved by any build keep their stored values.
  # "offline" (airplane mode) is deliberately not configurable — always starts
  # off.
  use_tor: false
  stable_onion: false
  dht_discovery: false
  dht_nick_publish: false
  # Verify chunked P2P transfers with a per-chunk hash chain (Settings toggle
  # default). Off = trust the transport; either SIDE turning it on enforces it.
  file_integrity: true

settings:
  # Defaults + clamp bounds for the user-tunable settings. The encrypted KV
  # store (ns p2p:settings) remains the runtime source of truth; these only
  # seed and bound it. Build-checked invariant: min <= default <= max.
  connect_timeout_secs:  { default: 60,  min: 5,  max: 600 }
  dht_room_publish_secs: { default: 600, min: 60, max: 3600 }
  max_file_size_mb:      { default: 16,  min: 0,  max: 102400 }  # 0 = unlimited
  map_storage_limit_mb:  { default: 512, min: 64, max: 65536 }   # total on-disk map regions
  # Device linking (Settings → Devices). pair_window bounds how long a pairing
  # QR (and its one-time secret) stays redeemable on the primary; resync paces
  # the linked-device catch-up exchange; history cap bounds the per-room
  # persisted chat log (oldest segment pruned past it).
  devlink_pair_window_secs: { default: 600, min: 60, max: 3600 }
  devlink_resync_secs:      { default: 300, min: 30, max: 3600 }
  chat_history_cap_msgs:    { default: 500, min: 50, max: 5000 }
  # Auto-lock: minutes of user inactivity before the vault locks itself and the
  # app returns to the passphrase gate. 0 = never auto-lock. A live call or
  # in-flight transfer defers the countdown (see src/idleLock.ts).
  idle_lock_mins:           { default: 15,  min: 0,  max: 120 }
  # Peer sync (peer.md): how often a live link re-announces and pulls a diff.
  peer_resync_secs:         { default: 300, min: 30, max: 3600 }
  # P2P transfer chunk, KiB ("file chunk size" in Settings). Each chunk
  # rides as one MLS message; max must fit network.max_frame_bytes.
  file_chunk_kib:           { default: 256, min: 16, max: 4096 }
  # Digits in the unlock PIN. Each extra digit is ~3.3 bits; the PIN guards an
  # in-session re-unlock only, never data at rest.
  pin_digits:               { default: 6, min: 4, max: 12 }

network:
  # WIRE-INTEROP: peers in one room must agree on max_frame_bytes — it caps the
  # Tor transport frame AND the iroh-gossip message size. A peer built with a
  # larger value can emit messages a smaller-cap peer rejects. Change only in
  # lockstep across a fleet.
  max_frame_bytes: 16777216      # 16 MiB
  # Not interop-sensitive: the virtual onion port rides inside each ticket, so
  # joiners always use the ticket's value; changing it affects new tickets only.
  onion_port: 9999
  # Local-only tuning (no wire impact).
  tor_write_timeout_secs: 20
  tor_handshake_timeout_secs: 30
