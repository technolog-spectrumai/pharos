[package]
name = "enigma"
version = "0.1.0"
description = "Enigma — serverless, end-to-end-encrypted (MLS) peer-to-peer chat (Tauri shell)"
authors = ["SpectrumAI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enigma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build_config.yaml → generated consts (see build.rs). Build-time only: the
# shipped binary contains no YAML parser. serde_norway is the maintained fork
# of the archived serde_yaml (same serde API, pure Rust — Android-safe).
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
# Reads tauri.conf.json for the app-identity equality assert.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Native file/save dialogs for picking a file to send and where to save a received one.
tauri-plugin-dialog = "2"
# Native OS notifications (desktop + Android/iOS) for upcoming-meeting reminders.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crypto layer (OpenMLS via Rotor). Vendored in-repo at cryptorotor/rotor_core —
# consumed by path, so building enigma needs no GitLab access.
rotor-core = { path = "../../../cryptorotor/rotor_core" }
# Encryption at rest: the centralized encrypted store (protasius) built on the
# crypto primitives crate (gervasius). All app data persists through protasius.
protasius = { path = "../../../protasius" }
# Reused directly (not just via protasius) for passphrase-protected local files
# (local_lock.rs): per-file vault + seal/open over the chosen file's bytes.
gervasius = { path = "../../../cryptorotor/gervasius" }
zeroize = "1"
cpal = "0.15"
hound = "3"
# Pure-Rust FFT for the voice-call equalizer (vox.rs → `vox://spectrum`); no C
# toolchain, MSRV-safe.
rustfft = "6"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
# Embedded pure-Rust Tor (arti). Outbound client plumbing (tor.rs) plus the
# peer-hosted onion transport (p2p_tor.rs). `onion-service-service` enables
# hidden-service HOSTING and transitively pulls in the persistent keystore
# (keymgr) + tor-persist state-dir that keep our .onion stable across restarts.
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "compression"] }
tor-rtcompat = { version = "0.43", features = ["tokio", "rustls"] }
# Hosting types not re-exported by arti-client: the onion-service config/launch
# surface, and the `Connected` relay cell used to accept an inbound onion stream.
tor-hsservice = "0.43"
tor-cell = "0.43"
# HsId (the .onion address) is redaction-safe and has no plain Display; the
# DisplayRedacted trait gives the full address for the QR ticket.
safelog = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# TLS over the Tor stream (https onion); ring provider avoids a C toolchain.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Mozilla root bundle for verifying real CA-signed certs on direct clearnet cloud
# HTTPS (loopback/onion keep tor.rs's accept-any-cert). Pure Rust, no C toolchain;
# already in the tree transitively via arti, so this adds no new compilation.
webpki-roots = "1"
# MSRV pin (Cargo.lock is gitignored, so this must live here): typed-index-collections
# 3.4+ requires rustc 1.90, but arti pulls it in transitively. Hold it at 3.3.0
# (supports rustc 1.85+) until the toolchain moves to >= 1.90, then this can drop.
typed-index-collections = "=3.3.0"
data-encoding = "2"
# Direct P2P chat backend (iroh-gossip over QUIC) — the app's only transport.
# `address-lookup-pkarr-dht` adds Mainline-DHT publish/resolve of node addresses
# (serverless discovery, opt-in via the Settings DHT toggle — technology.md §12).
iroh = { version = "0.98", features = ["address-lookup-pkarr-dht"] }
iroh-gossip = "0.98"
n0-future = "0.3"   # BoxStream type for the AddressLookup impl (matches iroh 0.98)
# Sealed room invites (invite_seal.rs): HPKE single-shot + the ed25519→x25519
# conversion for addressing a peer by their NodeId. All three are already in
# Cargo.lock via openmls/tor-llcrypto — no new compilation.
curve25519-dalek = "4"
openmls_traits = "0.4"
openmls_rust_crypto = "0.4"
# Direct BEP44 access to the Mainline DHT for the room-rendezvous records
# (p2p_dht.rs). Same crate/version iroh's DHT feature resolves — no dup tree.
mainline = { version = "6", features = ["async"] }
# Seals rendezvous records so DHT observers can't read room membership.
# 0.10 pinned: 0.11 changes the aead API surface.
chacha20poly1305 = "0.10"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
bytes = "1"
# PMTiles read (mmap local blobs + custom range-HTTP backend) and write (region
# extraction). Kept to the minimal feature set: no reqwest/S3/zstd/brotli.
pmtiles = { version = "0.23", default-features = false, features = ["write", "mmap-async-tokio"] }
futures-lite = "2"
anyhow = "1"
# Local key/value cache backend (pure-Rust LSM, no C deps — same rationale as
# μ-law/rustls/flat-file cache). Used by kv.rs.
fjall = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_22"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
# arti-client pulls in rusqlite (tor-dirmgr's directory cache) which links the
# system libsqlite3. The Android NDK ships no libsqlite3, so the cross-link fails
# with `ld.lld: unable to find library -lsqlite3`. Declaring rusqlite here (same
# version arti resolves) with `bundled` makes libsqlite3-sys compile SQLite from
# source via the NDK clang. Android-only, so desktop keeps using the system lib.
rusqlite = { version = "0.39", features = ["bundled"] }

[profile.dev]
# The enigma debug binary embeds hundreds of MB of DWARF (iroh + arti + cpal +
# tauri). The GNU linker merging it all spikes to multiple GB and gets OOM-killed
# (`ld ... signal 9`) on low-RAM machines. Keeping debug info in the object files
# instead of linking it into the executable slashes peak linker memory and binary
# size; full gdb debugging still works (it reads the .o files).
split-debuginfo = "unpacked"

