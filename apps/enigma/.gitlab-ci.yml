workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [test, check, e2e, build]

node:vitest:
  stage: test
  image: node:22-bookworm
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: npm
    paths: [.npm/]
  before_script:
    # rakotis is a private git dependency; rewrite its https URL to a job-token
    # URL (requires this project on rakotis' job-token allowlist).
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
  script:
    - npm ci
    - npm run test --workspaces

cargo:check:
  stage: check
  image: rust:1-bookworm
  parallel:
    matrix:
      - APP: [enigma, aurora, enigma_plus]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo-$APP
    paths:
      - .cargo/registry
      - apps/$APP/src-tauri/target/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential
    # cryptorotor is a private git dependency; rewrite its https URL to a
    # job-token URL (requires this project on cryptorotor's job-token allowlist).
    # .cargo/config.toml already sets net.git-fetch-with-cli = true.
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    # tauri-build validates that frontendDist ("../dist") exists
    - mkdir -p apps/$APP/dist
  script:
    - cd apps/$APP/src-tauri && cargo check

# Stubbed smoke tier only: live.spec self-skips without E2E_SERVER.
# The image version must match @playwright/test in package-lock.json.
playwright:smoke:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  parallel:
    matrix:
      - APP: [enigma, aurora, enigma_plus]
  retry: 1
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: npm
    paths: [.npm/]
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
  script:
    - npm ci
    - npm run test:e2e -w apps/$APP
  artifacts:
    when: on_failure
    paths: [apps/$APP/test-results/]
    expire_in: 7 days

tauri:desktop:
  stage: build
  image: rust:1-bookworm
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo-desktop
    paths:
      - .cargo/registry
      - apps/enigma/src-tauri/target/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential curl file
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
  script:
    - npm ci
    - cd apps/enigma && npx tauri build
  artifacts:
    paths: [apps/enigma/src-tauri/target/release/bundle/]
    expire_in: 30 days

# Android needs an SDK/NDK image plus signing configuration; the host-provisioning
# scripts (scripts/setup_java.sh, setup_rust_android.sh, install_android_studio.sh)
# and build_android.md document the requirements. Not wired to a CI image yet.
android:build:
  stage: build
  image: rust:1-bookworm
  when: manual
  allow_failure: true
  script:
    - echo "Android CI is not provisioned. Build locally with:"
    - echo "  bash scripts/build_android.sh <enigma|aurora> [debug|release]"
    - echo "See build_android.md for SDK/NDK setup."
    - exit 1
