# What `./build.sh` builds. This file is the whole interface: there are no
# build flags, and no other way to produce a bundle.
#
#   ./build.sh                 every app below
#   ./build.sh --dry-run       print the commands this file resolves to, run none
#   ./build.sh --config FILE   read another file with this shape instead
#
# An unknown key or value is an error, not a default: a typo here must not
# quietly build something else.

# Where finished packages are copied — one folder per app, with a SHA256SUMS
# beside them. Relative to the repo root. Remove the line to leave them where
# cargo and gradle put them.
output_dir: dist

apps:
  enigma:
    # Which feature set is compiled in: this names
    # apps/enigma/src-tauri/configs/build_config.<edition>.yaml, and THAT file
    # is where the features, limits and crypto parameters are set (build.rs
    # validates it and bakes it into the binary). basic | standard |
    # professional are the product line (technology.md §20); `custom` is a gitignored
    # file of your own. Remove the line to build the plain
    # src-tauri/build_config.yaml.
    edition: professional

    # Run the app's frontend and Rust test suites first; a failure stops the
    # build before anything is packaged.
    test: false

    desktop:
      enabled: true
      profile: release          # release | debug (debug builds far faster, runs slower)
      # Package formats. Tauri compiles for the machine it runs on, so only
      # this host's formats are accepted: deb, rpm, appimage on Linux; dmg, app
      # on macOS; msi, nsis on Windows. Remove the line to use the targets in
      # the app's tauri.conf.json.
      bundles: [deb, rpm]

    android:
      enabled: false
      profile: debug            # debug | release (release needs a signing key — technology.md §19)
      abis: [aarch64]           # aarch64 (phones) | x86_64 (emulator) | armv7 | i686, or [all]
      # A release that is deliberately NOT signed. It installs nowhere and
      # must never be distributed.
      allow_unsigned_release: false
