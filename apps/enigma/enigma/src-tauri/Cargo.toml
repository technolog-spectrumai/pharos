[package]
name = "enigma"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "enigma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rotor-core = { path = "../../../toto/rotors/rotor_core" }
zeroize = "1"
# AEAD for Vox call audio, keyed by an MLS-exported secret (pure Rust, Android-safe).
chacha20poly1305 = "0.10"
cpal = "0.15"
hound = "3"
# Pure-Rust FFT for the real-time Vox call equalizer (incoming-audio spectrum).
rustfft = "6"
# Rust-owned data layer: HTTP gateway (reqwest), realtime WS backend
# (tokio-tungstenite), async runtime + helpers.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
data-encoding = "2"
# Direct P2P chat backend (iroh-gossip over QUIC).
iroh = "0.98"
iroh-gossip = "0.98"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
bytes = "1"
futures-lite = "2"
anyhow = "1"
# Mission data layer: a yrs CRDT document persisted with fjall (pure-Rust LSM, no C
# deps — same rationale as μ-law/rustls/flat-file cache). yrs is pinned to 0.19 to match
# yrs-kvstore 0.3 (its KVStore→DocOps trait is implemented over a fjall partition).
yrs = "0.19"
yrs-kvstore = "0.3"
fjall = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_22"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

