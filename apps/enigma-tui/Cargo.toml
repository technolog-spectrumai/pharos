[package]
name = "enigma-tui"
version = "0.1.0"
description = "Enigma in the console (ratatui): rooms, chat, invitations, Friends and the Enable Beacon button, on enigma-core."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

[[bin]]
name = "enigma-tui"
path = "src/main.rs"

[dependencies]
enigma-core = { path = "../../crates/enigma-core" }
ratatui = "0.30"
crossterm = "0.29"
qrcodegen = "1.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints.rust]
unsafe_code = "forbid"
