[package]
name = "enigma-tui"
version = "0.1.0"
description = "Enigma in the console (ratatui): rooms, chat, invitations, Friends and the Enable Beacon button, on enigma-core."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

[[bin]]
name = "enigma-tui"
path = "src/main.rs"

[dependencies]
enigma-core = { path = "../../crates/enigma-core" }
enigma-app = { path = "../../crates/enigma-app" }
ratatui = "0.30"
crossterm = "0.29"

[lints.rust]
unsafe_code = "forbid"
