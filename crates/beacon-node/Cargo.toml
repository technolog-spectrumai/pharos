[package]
name = "beacon-node"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The Pharos Tor mesh: one arti client, an onion per room, signed member links, padded framing and cover traffic. Tauri-free; the embedder supplies a Host."
license = "AGPL-3.0-only"

[dependencies]
# Same arti surface the app used: hosting onions with a keystore, full
# vanguards set explicitly (arti 0.43 does not pick full mode by itself).
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "compression", "vanguards", "experimental-api", "keymgr"] }
tor-guardmgr = { version = "0.43", features = ["vanguards"] }
tor-config = "0.43"
tor-rtcompat = { version = "0.43", features = ["tokio", "rustls"] }
tor-hsservice = "0.43"
tor-cell = "0.43"
safelog = "0.8"
typed-index-collections = "=3.3.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3.0"
hex = "0.4"
blake3 = "1"
postcard = { version = "1", features = ["use-std"] }
futures-lite = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
# OsRng for the cover-traffic jitter (the same source the app used).
chacha20poly1305 = "0.10"
# The sealed SQLite queue (feature `sqlite`): the beacon binary and the app's in-process Beacon.
rusqlite = { version = "0.39", features = ["bundled"], optional = true }

[features]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
