[package]
name = "pharos-rendezvous"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pharos: a friendship's weekly onion keys, mailbox ids and directory keys, derived from its secret"
license = "AGPL-3.0-only"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = "2"
data-encoding = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
ed25519-dalek = { version = "2", features = ["hazmat"] }
