[package]
name = "enigma-app"
version = "0.1.0"
description = "Enigma's UI-agnostic app layer: state, actions, backend trait (demo + real: vault, client link over Tor, in-process Beacon), codes, avatars, texts. Shared by enigma-slint and enigma-tui."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
enigma-core = { path = "../enigma-core" }
qrcodegen = "1.8"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
enigmatite = { path = "../enigmatite" }
enigma-client = { path = "../enigma-client" }
beacon-node = { path = "../beacon-node", features = ["sqlite"] }
pharos-tor = { path = "../pharos-tor" }
pharos-id = { path = "../pharos-id" }
protasius = { path = "../protasius" }
gervasius = { path = "../gervasius" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
blake3 = "1"
hex = "0.4"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"
