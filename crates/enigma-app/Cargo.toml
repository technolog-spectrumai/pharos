[package]
name = "enigma-app"
version = "0.1.0"
description = "Enigma's UI-agnostic app layer: state, actions, backend trait (demo + real: vault, client link over Tor to the user's Beacon), codes, avatars, texts. Shared by enigma27 and enigma-tui."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
enigma-core = { path = "../enigma-core" }
qrcodegen = "1.8"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
enigmatite = { path = "../enigmatite" }
enigma-client = { path = "../enigma-client" }
# The client link's Dialer types only (the client never hosts a Beacon).
beacon-node = { path = "../beacon-node" }
pharos-tor = { path = "../pharos-tor", features = ["client-discovery"] }
pharos-id = { path = "../pharos-id" }
protasius = { path = "../protasius" }
gervasius = { path = "../gervasius" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
blake3 = "1"
hex = "0.4"
anyhow = "1"
# Pictures to send (scaled, re-encoded: no EXIF) and QR codes read from image files.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.9"

[lints.rust]
unsafe_code = "forbid"
