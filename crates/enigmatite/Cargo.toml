[package]
name = "enigmatite"
version = "0.1.0"
description = "Enigma's room engine, the Rust half: MLS sessions per room (rotor) kept in the app's store, and the admission proofs for a certified roster."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

# No tauri: the app keeps its own commands. rakotis (apps/enigma/packages/rakotis) is the
# TypeScript half that drives it.

[dependencies]
rotor-core = { path = "../rotor/rotor_core" }
ed25519-dalek = "3.0"
blake3 = "1"
data-encoding = "2"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
