[package]
name = "enigmatite"
version = "0.1.0"
description = "Enigma's room engine, the Rust half: MLS sessions per room (rotor) kept in an app's store, and the iroh-gossip room gateway (Ferrozine) that emits the realtime://message and realtime://status events rakotis' chat transport reads. Shared by Enigma and Teutates."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

# No tauri: each app turns the gateway's events into its own Tauri events and keeps its own
# command names (Ferrozine's rule). rakotis (apps/enigma/packages/rakotis) is the TypeScript
# half that drives it.

[dependencies]
rotor-core = { path = "../rotor/rotor_core" }
ferrozine = { path = "../ferrozine" }
iroh = "1.4"
iroh-gossip = "0.102"
bytes = "1"
ed25519-dalek = "3.0"
blake3 = "1"
data-encoding = "2"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
