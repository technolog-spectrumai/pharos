[package]
name = "enigma-core"
version = "0.1.0"
description = "Enigma's room engine in Rust (ported from rakotis' useChatChannel.ts): MLS via enigmatite/rotor, roster, timeline, invitations, Beacon mailbox. No Tauri, no UI."
authors = ["SpectrumAI"]
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
enigmatite = { path = "../enigmatite" }
ed25519-dalek = "3.0"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints.rust]
unsafe_code = "forbid"
