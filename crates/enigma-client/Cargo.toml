[package]
name = "enigma-client"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Enigma's client link to its Beacon (stage b2): enigma_core::Transport over a signed link, over Tor or in-process; reconnect, resend, acks."
license = "AGPL-3.0-only"
publish = false

[dependencies]
beacon-node = { path = "../beacon-node" }
enigma-core = { path = "../enigma-core" }
pharos-tor = { path = "../pharos-tor" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "io-util"] }
serde_json = "1"
ed25519-dalek = "3.0"
hex = "0.4"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
blake3 = "1"

[lints.rust]
unsafe_code = "forbid"
