[package]
name = "pharos-tor"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pharos onion transport over arti: host an onion (with a key we derived, or arti's own), dial one, with timeouts"
license = "AGPL-3.0-only"

[dependencies]
# experimental-api: launch_onion_service_with_hsid, to host the rendezvous onion
# whose key both friends derive (D2).
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "compression", "experimental-api"] }
tor-rtcompat = { version = "0.43", features = ["tokio", "rustls"] }
tor-hsservice = "0.43"
tor-hscrypto = "0.43"
tor-llcrypto = "0.43"
tor-cell = "0.43"
safelog = "0.8"
typed-index-collections = "=3.3.0"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
anyhow = "1"

[dev-dependencies]
pharos-rendezvous = { path = "../pharos-rendezvous" }
