[package]
name = "gervasius"
version = "0.1.0"
edition = "2021"
description = "At-rest encryption primitives: Argon2id KDF + XChaCha20-Poly1305 wrapped-key vault envelope."

# Pure-Rust, wasm-clean. Named for St. Gervasius (paired with Protasius) — the
# crypto half of Enigma's encryption-at-rest; the store half is `protasius`.

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
# Public-key sealing (`seal.rs`): ephemeral X25519 -> HKDF-SHA256 -> the AEAD
# above. Versions match what iroh/arti already resolve in the app's lockfile, so
# nothing new enters the dependency tree — these become direct deps of a crate
# that was already pulling them in transitively. All pure Rust, so the crate
# stays wasm-clean.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }

# The gervazy module (`gervazy.rs`): the toto platform's file-vault
# construction (Argon2id -> Fernet), for content that must be portable to the
# server. Zinnia's sealed-file detection (substrate::is_sealed_file) needs
# `gervazy::is_sealed` to recognise a platform-sealed file it cannot open.
#
# OPTIONAL, and off by default, because `fernet` pulls `openssl` and so
# `openssl-sys` — native OpenSSL, in a crate whose whole point is being pure
# Rust and wasm-clean. Enigma had no OpenSSL by any other route before the two
# forks were merged; gating it keeps that true for consumers that never touch
# the platform format. Zinnia turns it on: `features = ["gervazy"]`.
fernet = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
# The toto platform's legacy vault format: detection and read-only open.
gervazy = ["dep:fernet", "dep:base64"]

[dev-dependencies]
serde_json = "1"
