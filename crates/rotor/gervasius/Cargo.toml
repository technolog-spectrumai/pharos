[package]
name = "gervasius"
version = "0.1.0"
edition = "2021"
description = "At-rest encryption primitives: Argon2id KDF + XChaCha20-Poly1305 wrapped-key vault envelope."

# Pure-Rust, wasm-clean. Named for St. Gervasius (paired with Protasius) — the
# crypto half of Enigma's encryption-at-rest; the store half is `protasius`.

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
# Public-key sealing (`seal.rs`): ephemeral X25519 -> HKDF-SHA256 -> the AEAD
# above. Versions match what iroh/arti already resolve in the app's lockfile, so
# nothing new enters the dependency tree — these become direct deps of a crate
# that was already pulling them in transitively. All pure Rust, so the crate
# stays wasm-clean.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1"
