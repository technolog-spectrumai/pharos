[package]
name = "protasius"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Enigma's centralized per-profile encrypted-at-rest data store (fjall + gervasius). Tauri-agnostic."

# Named for St. Protasius (paired with Gervasius). The store half of Enigma's
# encryption-at-rest: one fjall keyspace per profile holding only sealed values,
# unlocked by a passphrase-derived key (via the `gervasius` primitives crate).

[dependencies]
# The crypto crates are the repo's shared ones (crates/rotor) — see
# apps/enigma/src-tauri/Cargo.toml.
gervasius = { path = "../gervasius" }
fjall = "2"
# Filler bytes for the unused panic slot (must be indistinguishable from a real
# wrapped key, so they come from the OS CSPRNG — same source gervasius uses).
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
