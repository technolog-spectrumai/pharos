# Pharos: Nautes (the client), Proteus (the optional server, from Stage 3) and
# the crates they share.
[workspace]
resolver = "3"
members = [
    "crates/gervasius",
    "crates/rotor/rotor_core",
    "crates/ferrozine",
    "crates/protasius",
    "nautes/src-tauri",
]
exclude = [
    "crates/rotor/bindings",
]

[workspace.package]
rust-version = "1.94"

[profile.dev]
split-debuginfo = "unpacked"
