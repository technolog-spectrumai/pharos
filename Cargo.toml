# Pharos: Enigma (the client), Beacon (the optional server, from Stage 3) and
# the crates they share.
[workspace]
resolver = "3"
members = [
    "crates/gervasius",
    "crates/rotor/rotor_core",
    "crates/protasius",
    "crates/pharos-wire",
    "crates/pharos-rendezvous",
    "crates/pharos-seal",
    "crates/pharos-id",
    "crates/pharos-tor",
    "crates/beacon-node",
    "beacon",
    "crates/enigmatite",
    "crates/enigma-core",
    "crates/enigma-app",
    "apps/enigma-tui",
    "crates/enigma-client",
    "apps/enigma27",
    "apps/pharos-lighthouse",
    "apps/enigma/src-tauri",
]
exclude = [
    "crates/rotor/bindings",
]

[workspace.package]
rust-version = "1.94"

[profile.dev]
split-debuginfo = "unpacked"

# Beacon on a Raspberry Pi: small and stripped. (Enigma' bundle uses the same profile.)
[profile.release]
strip = true
lto = "thin"
codegen-units = 4
