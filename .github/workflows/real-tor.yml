name: real-tor
# End to end over the real Tor network (slow, and needs outbound connections
# to Tor relays, which some sandboxes do not allow). Run by hand.
on: workflow_dispatch
jobs:
  real-tor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # Two Enigma instances, one hosting an onion with full vanguards and one
      # dialling it, exchanging frames over the real Tor network.
      - run: ./test_tor2.sh
  # Beacon over the real Tor network (8.E2): serve it on a fresh onion, then
  # post to a mailbox and read it back through a separate arti client.
  beacon-real-tor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p beacon --example probe
      - name: serve and probe
        run: |
          D=$(mktemp -d)
          printf 'data_dir: %s/data\nmaster_key: %s/master.key\nname: CI\n' "$D" "$D" > "$D/config.yaml"
          ./target/debug/beacon init -c "$D/config.yaml"
          ./target/debug/beacon serve -c "$D/config.yaml" > "$D/serve.log" 2>&1 &
          for i in $(seq 1 120); do [ -s "$D/data/onion.txt" ] && break; sleep 5; done
          ONION=$(cat "$D/data/onion.txt"); echo "onion: $ONION"
          sleep 60   # let the descriptor reach the HSDirs
          ./target/debug/examples/probe "$ONION" "$D/client" || { cat "$D/serve.log"; exit 1; }
