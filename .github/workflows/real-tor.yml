name: real-tor
# End to end over the real Tor network (slow, and needs outbound connections
# to Tor relays, which some sandboxes do not allow). Run by hand.
on: workflow_dispatch
jobs:
  real-tor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pharos-node --test real_tor -- --ignored --nocapture
