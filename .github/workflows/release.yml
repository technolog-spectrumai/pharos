name: release
# On a tag v*: Enigma for Linux and Windows, Proteus for Raspberry Pi (arm64 binary and .deb).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  enigma:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tauri build
        working-directory: enigma
      - uses: actions/upload-artifact@v4
        with:
          name: enigma-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
  proteus-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@1.94
        with: { targets: aarch64-unknown-linux-gnu }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p proteus --target aarch64-unknown-linux-gnu
      - run: cargo install cargo-deb --locked && cargo deb -p proteus --target aarch64-unknown-linux-gnu --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: proteus-arm64
          path: |
            target/aarch64-unknown-linux-gnu/release/proteus
            target/aarch64-unknown-linux-gnu/debian/*.deb
